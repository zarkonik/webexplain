services:
  postgres:
    image: postgres:16-alpine
    container_name: webexplain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webexplain
      POSTGRES_USER: webexplain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - webexplain_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend/WebExplain.Api
    container_name: webexplain-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=webexplain;Username=webexplain;Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: WebExplain
      Jwt__Audience: WebExplain
      Jwt__ExpiryHours: "24"
    volumes:
      - webexplain_storage:/app/Storage
    depends_on:
      - postgres
    networks:
      default:
      # "backend" is already taken as an alias on this shared network (by
      # Radio2gether's own backend container), so this container needs a name of its
      # own here to avoid two containers answering to the same DNS name.
      talkforum_default:
        aliases:
          - webexplain-backend

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: webexplain-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      default:
      # Same reasoning as above - "web" is already taken by TalkForum's own Caddy
      # container on this shared network.
      talkforum_default:
        aliases:
          - webexplain-web

volumes:
  webexplain_postgres_data:
  webexplain_storage:

networks:
  default:
  # The shared Caddy container (talkforum-web-1) that already owns ports 80/443 on the
  # VPS lives on this network - joining it is how that Caddy can reach these two
  # containers by name to reverse-proxy webexplain.tech, without this app publishing
  # any ports of its own.
  talkforum_default:
    external: true
